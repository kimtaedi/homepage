<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calendar Preview</title>
    <style>
        body {
            margin: 0;
            padding: 10px;
            font-family: Arial, sans-serif;
            background: white;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }
        
        /* 캘린더 컨테이너 */
        .calendar-container {
            width: 100%;
            max-width: 100%;
            background: white;
            border-radius: 8px;
            padding: 15px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            box-sizing: border-box;
        }
        
        /* PC 화면 */
        @media (min-width: 768px) {
            body {
                padding: 20px;
            }
            .calendar-container {
                padding: 25px;
            }
        }

        /* 캘린더 헤더 */
        .calendar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .calendar-header button {
            background: none;
            border: none;
            font-size: 20px;
            cursor: pointer;
            padding: 8px 12px;
            color: #666;
        }

        .calendar-header button:hover {
            color: #000;
        }

        .calendar-header .current-month {
            font-size: 18px;
            font-weight: bold;
        }

        /* 요일 헤더 */
        .calendar-weekdays {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 8px;
            margin-bottom: 8px;
        }

        .calendar-weekdays div {
            text-align: center;
            font-size: 13px;
            font-weight: bold;
            color: #666;
            padding: 10px 0;
        }
        
        /* PC 화면 */
        @media (min-width: 768px) {
            .calendar-header button {
                font-size: 24px;
                padding: 10px 15px;
            }
            .calendar-header .current-month {
                font-size: 22px;
            }
            .calendar-weekdays {
                gap: 10px;
                margin-bottom: 10px;
            }
            .calendar-weekdays div {
                font-size: 15px;
                padding: 12px 0;
            }
        }

        /* 날짜 그리드 */
        .calendar-days {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 8px;
        }

        .calendar-day {
            aspect-ratio: unset;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding: 8px 4px;
            font-size: 16px;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
            position: relative;
            min-height: 60px;
        }
        
        .calendar-day-number {
            font-weight: bold;
            margin-bottom: 4px;
        }
        
        .calendar-day-title {
            font-size: 10px;
            color: #666;
            text-align: center;
            line-height: 1.2;
            overflow: hidden;
            text-overflow: ellipsis;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            width: 100%;
        }
        
        .calendar-day.has-post .calendar-day-title {
            color: white;
        }
        
        /* PC 화면 - 더 큰 폰트 */
        @media (min-width: 768px) {
            .calendar-days {
                gap: 10px;
            }
            .calendar-day {
                font-size: 18px;
                min-height: 80px;
                padding: 10px 6px;
            }
            .calendar-day-title {
                font-size: 11px;
            }
        }

        .calendar-day:hover {
            background: #f0f0f0;
        }

        .calendar-day.other-month {
            color: #ccc;
        }

        .calendar-day.today {
            border: 2px solid #4a90e2;
            font-weight: bold;
        }

        .calendar-day.has-post {
            background: #4a90e2;
            color: white;
            font-weight: bold;
        }

        .calendar-day.has-post:hover {
            background: #357abd;
        }

        .calendar-day.selected {
            background: #2ecc71;
            color: white;
        }
    </style>
</head>
<body>
    <div id="calendar">로딩 중...</div>
    
    <!-- 선택된 날짜의 게시물 목록 -->
    <div id="post-list" style="margin-top: 20px; padding: 15px; background: #f9f9f9; border-radius: 8px; display: none;">
        <h3 style="margin: 0 0 10px 0; font-size: 16px;">게시물</h3>
        <div id="posts-container"></div>
    </div>

    <script>
        // 테스트용 더미 데이터
        const DUMMY_DATA = {
            '2025-12-01': 2,
            '2025-12-10': 1,
            '2025-12-15': 3,
            '2025-12-16': 1
        };
        
        // 테스트용 게시물 상세 데이터
        const DUMMY_POSTS = {
            '2025-12-01': [
                { title: '첫 번째 게시물', content: '12월의 시작...' },
                { title: '두 번째 게시물', content: '오늘은 좋은 날...' }
            ],
            '2025-12-10': [
                { title: '중간 점검', content: '한 해를 돌아보며...' }
            ],
            '2025-12-15': [
                { title: '크리스마스 준비', content: '선물 리스트 작성' },
                { title: '연말 계획', content: '내년 목표 세우기' },
                { title: '독서 기록', content: '올해 읽은 책들' }
            ],
            '2025-12-16': [
                { title: '오늘의 일기', content: '캘린더 기능 추가...' }
            ]
        };

        class Calendar {
            constructor(containerId) {
                this.container = document.getElementById(containerId);
                this.currentDate = new Date();
                this.selectedDate = null;
                this.postsData = DUMMY_DATA;
                
                this.render();
            }

            render() {
                const year = this.currentDate.getFullYear();
                const month = this.currentDate.getMonth();
                
                this.container.innerHTML = `
                    <div class="calendar-container">
                        <div class="calendar-header">
                            <button class="prev-month">◀</button>
                            <div class="current-month">${year}년 ${month + 1}월</div>
                            <button class="next-month">▶</button>
                        </div>
                        <div class="calendar-weekdays">
                            <div>일</div>
                            <div>월</div>
                            <div>화</div>
                            <div>수</div>
                            <div>목</div>
                            <div>금</div>
                            <div>토</div>
                        </div>
                        <div class="calendar-days">
                            ${this.generateDays(year, month)}
                        </div>
                    </div>
                `;

                this.attachEvents();
            }

            generateDays(year, month) {
                const firstDay = new Date(year, month, 1);
                const lastDay = new Date(year, month + 1, 0);
                const prevLastDay = new Date(year, month, 0);
                
                const firstDayWeek = firstDay.getDay();
                const lastDate = lastDay.getDate();
                const prevLastDate = prevLastDay.getDate();
                
                const today = new Date();
                const todayStr = `${today.getFullYear()}-${String(today.getMonth() + 1).padStart(2, '0')}-${String(today.getDate()).padStart(2, '0')}`;
                
                let html = '';
                
                // 이전 달 날짜들
                for (let i = firstDayWeek - 1; i >= 0; i--) {
                    const day = prevLastDate - i;
                    html += `<div class="calendar-day other-month"><div class="calendar-day-number">${day}</div></div>`;
                }
                
                // 현재 달 날짜들
                for (let day = 1; day <= lastDate; day++) {
                    const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
                    const postCount = this.postsData[dateStr] || 0;
                    const posts = DUMMY_POSTS[dateStr] || [];
                    
                    let classes = ['calendar-day'];
                    if (dateStr === todayStr) classes.push('today');
                    if (postCount > 0) classes.push('has-post');
                    
                    // 첫 번째 게시물 제목만 표시
                    const firstTitle = posts.length > 0 ? posts[0].title : '';
                    const titleHtml = firstTitle ? `<div class="calendar-day-title">${firstTitle}</div>` : '';
                    
                    html += `<div class="${classes.join(' ')}" data-date="${dateStr}" data-count="${postCount}">
                        <div class="calendar-day-number">${day}</div>
                        ${titleHtml}
                    </div>`;
                }
                
                // 다음 달 날짜들
                const totalCells = Math.ceil((firstDayWeek + lastDate) / 7) * 7;
                const remainingCells = totalCells - (firstDayWeek + lastDate);
                for (let day = 1; day <= remainingCells; day++) {
                    html += `<div class="calendar-day other-month"><div class="calendar-day-number">${day}</div></div>`;
                }
                
                return html;
            }

            attachEvents() {
                this.container.querySelector('.prev-month').addEventListener('click', () => {
                    this.currentDate.setMonth(this.currentDate.getMonth() - 1);
                    this.render();
                });

                this.container.querySelector('.next-month').addEventListener('click', () => {
                    this.currentDate.setMonth(this.currentDate.getMonth() + 1);
                    this.render();
                });

                this.container.querySelectorAll('.calendar-day:not(.other-month)').forEach(dayEl => {
                    dayEl.addEventListener('click', (e) => {
                        const date = e.target.dataset.date;
                        if (date) {
                            this.onDateClick(date);
                        }
                    });
                });
            }

            onDateClick(dateStr) {
                console.log('선택된 날짜:', dateStr);
                this.selectedDate = dateStr;
                
                this.container.querySelectorAll('.calendar-day').forEach(el => {
                    el.classList.remove('selected');
                });
                this.container.querySelector(`[data-date="${dateStr}"]`)?.classList.add('selected');
                
                // 게시물 목록 표시
                this.showPosts(dateStr);
            }
            
            showPosts(dateStr) {
                const postList = document.getElementById('post-list');
                const postsContainer = document.getElementById('posts-container');
                
                const posts = DUMMY_POSTS[dateStr];
                
                if (!posts || posts.length === 0) {
                    postList.style.display = 'none';
                    return;
                }
                
                postList.style.display = 'block';
                postsContainer.innerHTML = posts.map(post => `
                    <div style="border-bottom: 1px solid #ddd; padding: 10px 0; last-child:border-bottom: none;">
                        <div style="font-weight: bold; margin-bottom: 5px; font-size: 14px;">${post.title}</div>
                        <div style="color: #666; font-size: 13px;">${post.content}</div>
                    </div>
                `).join('');
            }
        }

        // 캘린더 초기화
        new Calendar('calendar');
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calendar - 김태디의 통통배</title>
    <style>
        /* --- 웹 폰트 정의 (Web Font Definition) --- */
        @font-face {
            font-family: 'Happiness-Sans-Regular';
            src: url('https://fastly.jsdelivr.net/gh/projectnoonnu/noonfonts_2205@1.0/Happiness-Sans-Regular.woff2') format('woff2');
            font-weight: 400;
            font-style: normal;
            unicode-range: U+AC00-D7A3; /* 한글 유니코드 범위 */
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Happiness-Sans-Regular', Arial, sans-serif;
            background: white;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            box-sizing: border-box;
        }
        
        /* 캘린더 컨테이너 */
        .calendar-container {
            width: 100%;
            max-width: 100%;
            background: white;
            border-radius: 0;
            padding: 0 15px;
            box-shadow: none;
            box-sizing: border-box;
        }
        
        /* PC 화면 */
        @media (min-width: 768px) {
            body {
                padding: 0;
            }
            .calendar-container {
                padding: 0 20px;
            }
        }

        /* 캘린더 헤더 */
        .calendar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .calendar-header button {
            background: none;
            border: none;
            font-size: 20px;
            cursor: pointer;
            padding: 8px 12px;
            color: #666;
        }

        .calendar-header button:hover {
            color: #000;
        }

        .calendar-header .current-month {
            font-size: 18px;
            font-weight: bold;
        }

        /* 요일 헤더 */
        .calendar-weekdays {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 8px;
            margin-bottom: 8px;
        }

        .calendar-weekdays div {
            text-align: center;
            font-size: 13px;
            font-weight: bold;
            color: #666;
            padding: 10px 0;
        }
        
        /* PC 화면 */
        @media (min-width: 768px) {
            .calendar-header button {
                font-size: 24px;
                padding: 10px 15px;
            }
            .calendar-header .current-month {
                font-size: 22px;
            }
            .calendar-weekdays {
                gap: 10px;
                margin-bottom: 10px;
            }
            .calendar-weekdays div {
                font-size: 15px;
                padding: 12px 0;
            }
        }

        /* 날짜 그리드 */
        .calendar-days {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 4px;
        }

        .calendar-day {
            aspect-ratio: unset;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding: 8px 4px;
            font-size: 16px;
            border-radius: 0;
            cursor: default;
            transition: all 0.2s;
            position: relative;
            min-height: 50px;
        }
        
        .calendar-day-number {
            font-weight: bold;
            margin-bottom: 4px;
        }
        
        .calendar-day-title {
            font-size: 10px;
            color: #666;
            text-align: center;
            line-height: 1.2;
            overflow: hidden;
            text-overflow: ellipsis;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            width: 100%;
        }
        
        .calendar-day.has-post .calendar-day-title {
            color: white;
        }
        
        /* PC 화면 - 더 큰 폰트 */
        @media (min-width: 768px) {
            .calendar-days {
                gap: 5px;
            }
            .calendar-day {
                font-size: 18px;
                min-height: 70px;
                padding: 10px 6px;
            }
            .calendar-day-title {
                font-size: 11px;
            }
        }

        .calendar-day:hover {
            background: #f0f0f0;
        }

        .calendar-day.other-month {
            color: #ccc;
        }

        .calendar-day.today {
            border: 2px solid #0EBF00;
            font-weight: bold;
        }

        .calendar-day.has-post {
            background: #0EBF00;
            color: white;
            font-weight: bold;
        }

        .calendar-day.has-post:hover {
            background: #0CA600;
        }

        .calendar-day.selected {
            background: #0EBF00;
            color: white;
            opacity: 0.8;
        }
    </style>
</head>
<body>
    <div id="calendar">로딩 중...</div>
    
    <!-- 선택된 날짜의 게시물 목록 -->
    <div id="post-list" style="margin-top: 20px; padding: 15px; background: #f9f9f9; border-radius: 0; display: none;">
        <h3 style="margin: 0 0 10px 0; font-size: 16px;">게시물</h3>
        <div id="posts-container"></div>
    </div>

    <script>
        // Apps Script URL
        const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyiFB1-WHX2C6lIPRLNgZvwFwdIq_TZtpiU7mnzTlDbPbFx-YnjwkjFGS6v364AUn8/exec';

        class Calendar {
            constructor(containerId) {
                this.container = document.getElementById(containerId);
                this.currentDate = new Date();
                this.selectedDate = null;
                this.postsData = {}; // {날짜: 게시물개수}
                this.postsByDate = {}; // {날짜: [게시물들]}
                
                this.init();
            }

            async init() {
                console.log('캘린더 초기화 시작');
                await this.loadPostsData();
                this.render();
            }

            async loadPostsData() {
                try {
                    console.log('게시물 데이터 로드 시도:', APPS_SCRIPT_URL);
                    const response = await fetch(`${APPS_SCRIPT_URL}?action=getPostsForCalendar`);
                    const data = await response.json();
                    
                    console.log('받은 데이터:', data);
                    
                    this.postsData = {};
                    this.postsByDate = {};
                    
                    if (data.posts && Array.isArray(data.posts)) {
                        data.posts.forEach(post => {
                            const dateStr = post.date;
                            if (dateStr) {
                                // 게시물 개수 집계
                                this.postsData[dateStr] = (this.postsData[dateStr] || 0) + 1;
                                
                                // 게시물 상세 저장
                                if (!this.postsByDate[dateStr]) {
                                    this.postsByDate[dateStr] = [];
                                }
                                this.postsByDate[dateStr].push(post);
                            }
                        });
                    }
                    console.log('처리된 게시물 데이터:', this.postsData);
                    console.log('날짜별 게시물:', this.postsByDate);
                } catch (error) {
                    console.error('게시물 데이터 로드 실패:', error);
                }
            }

            render() {
                const year = this.currentDate.getFullYear();
                const month = this.currentDate.getMonth();
                
                this.container.innerHTML = `
                    <div class="calendar-container">
                        <div class="calendar-header">
                            <button class="prev-month">◀</button>
                            <div class="current-month">${year}년 ${month + 1}월</div>
                            <button class="next-month">▶</button>
                        </div>
                        <div class="calendar-weekdays">
                            <div>일</div>
                            <div>월</div>
                            <div>화</div>
                            <div>수</div>
                            <div>목</div>
                            <div>금</div>
                            <div>토</div>
                        </div>
                        <div class="calendar-days">
                            ${this.generateDays(year, month)}
                        </div>
                    </div>
                `;

                console.log('캘린더 렌더링 완료');
                this.attachEvents();
            }

            generateDays(year, month) {
                const firstDay = new Date(year, month, 1);
                const lastDay = new Date(year, month + 1, 0);
                const prevLastDay = new Date(year, month, 0);
                
                const firstDayWeek = firstDay.getDay();
                const lastDate = lastDay.getDate();
                const prevLastDate = prevLastDay.getDate();
                
                const today = new Date();
                const todayStr = `${today.getFullYear()}-${String(today.getMonth() + 1).padStart(2, '0')}-${String(today.getDate()).padStart(2, '0')}`;
                
                let html = '';
                
                // 이전 달 날짜들
                for (let i = firstDayWeek - 1; i >= 0; i--) {
                    const day = prevLastDate - i;
                    html += `<div class="calendar-day other-month"><div class="calendar-day-number">${day}</div></div>`;
                }
                
                // 현재 달 날짜들
                for (let day = 1; day <= lastDate; day++) {
                    const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
                    const postCount = this.postsData[dateStr] || 0;
                    const posts = this.postsByDate[dateStr] || [];
                    
                    let classes = ['calendar-day'];
                    if (dateStr === todayStr) classes.push('today');
                    if (postCount > 0) classes.push('has-post');
                    
                    // 첫 번째 게시물 제목만 표시
                    const firstTitle = posts.length > 0 ? posts[0].title : '';
                    const titleHtml = firstTitle ? `<div class="calendar-day-title">${firstTitle}</div>` : '';
                    
                    html += `<div class="${classes.join(' ')}" data-date="${dateStr}" data-count="${postCount}">
                        <div class="calendar-day-number">${day}</div>
                        ${titleHtml}
                    </div>`;
                }
                
                // 다음 달 날짜들
                const totalCells = Math.ceil((firstDayWeek + lastDate) / 7) * 7;
                const remainingCells = totalCells - (firstDayWeek + lastDate);
                for (let day = 1; day <= remainingCells; day++) {
                    html += `<div class="calendar-day other-month"><div class="calendar-day-number">${day}</div></div>`;
                }
                
                return html;
            }

            attachEvents() {
                this.container.querySelector('.prev-month').addEventListener('click', () => {
                    this.currentDate.setMonth(this.currentDate.getMonth() - 1);
                    this.render();
                });

                this.container.querySelector('.next-month').addEventListener('click', () => {
                    this.currentDate.setMonth(this.currentDate.getMonth() + 1);
                    this.render();
                });

                // 날짜 클릭 이벤트 제거됨
            }

            onDateClick(dateStr) {
                console.log('선택된 날짜:', dateStr);
                this.selectedDate = dateStr;
                
                this.container.querySelectorAll('.calendar-day').forEach(el => {
                    el.classList.remove('selected');
                });
                this.container.querySelector(`[data-date="${dateStr}"]`)?.classList.add('selected');
                
                // 게시물 목록 표시
                this.showPosts(dateStr);
            }
            
            showPosts(dateStr) {
                const postList = document.getElementById('post-list');
                const postsContainer = document.getElementById('posts-container');
                
                const posts = this.postsByDate[dateStr];
                
                if (!posts || posts.length === 0) {
                    postList.style.display = 'none';
                    return;
                }
                
                postList.style.display = 'block';
                postsContainer.innerHTML = posts.map(post => `
                    <div style="border-bottom: 1px solid #ddd; padding: 10px 0;">
                        <div style="font-weight: bold; margin-bottom: 5px; font-size: 14px;">${post.title}</div>
                    </div>
                `).join('');
            }
        }

        // 캘린더 초기화
        console.log('스크립트 시작');
        new Calendar('calendar');
    </script>
</body>
</html>
